<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>나의 알림</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="icon">🔔</div>
  <h1>나의 알림</h1>
  <p class="desc">아래 버튼을 눌러 알림을 켜면, 이 앱을 닫아도 알림을 받을 수 있습니다.</p>
  <button id="btnEnable">알림 켜기</button>
  <p id="status" class="status">알림이 아직 켜지지 않았습니다.</p>
  <p class="hint">📱 아이폰(iOS 16.4+)은 이 페이지를 <b>홈 화면에 추가(설치)</b>한 뒤 열어야 알림을 받을 수 있습니다.</p>
</main>
<script src="app.js"></script>
</body>
</html>
