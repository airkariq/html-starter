<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --bg:#f8fafc;--card:#fff;--border2:rgba(0,0,0,.15);
    --text:#1e293b;--muted:#64748b;--dim:#94a3b8;--accent:#2563eb;--red:#dc2626;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:280px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:14px;}
  .brand{font-family:'Courier New',monospace;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:2px;}
  .brand em{color:#ea580c;font-style:normal;}
  .title{font-size:15px;font-weight:700;margin-bottom:12px;}
  .btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border2);background:var(--card);border-radius:9px;padding:11px 13px;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:8px;}
  .btn:hover{border-color:var(--accent);background:rgba(37,99,235,.05);}
  .btn-ic{font-size:20px;flex-shrink:0;}
  .btn-tx b{display:block;font-size:13px;color:var(--text);}
  .btn-tx span{display:block;font-size:11px;color:var(--muted);margin-top:1px;}
  .hint{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px;border-top:1px solid rgba(0,0,0,.08);padding-top:8px;}
  .err{display:none;font-size:11px;color:var(--red);background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2);border-radius:7px;padding:8px 10px;margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
  <div class="brand">DATA<em>FORGE</em></div>
  <div class="title">🔤 텍스트 추출</div>

  <button class="btn" id="btnRegion">
    <span class="btn-ic">⬚</span>
    <span class="btn-tx"><b>영역 드래그</b><span>사각형을 그려 그 안의 텍스트 추출</span></span>
  </button>
  <button class="btn" id="btnElement">
    <span class="btn-ic">🖱️</span>
    <span class="btn-tx"><b>요소 선택</b><span>문단·표 등에 올려 클릭</span></span>
  </button>

  <div class="hint">추출된 텍스트를 창에서 복사하거나 TXT로 저장 · ESC로 취소</div>
  <div class="err" id="err"></div>

  <script src="popup.js"></script>
</body>
</html>
